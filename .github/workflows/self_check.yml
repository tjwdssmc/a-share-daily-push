name: A股每日收盘自检（云端）
# 触发方式：定时 + 手动
on:
  schedule:
    # 北京时间 16:00 = UTC 08:00（收盘自检）
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行收盘自检
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python self_check_cloud.py

      - name: 提交更新到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 尾盘预警样本库.csv 每日自检日志.md
          git diff --cached --quiet || git commit -m "chore: 每日自检更新 $(date +%Y-%m-%d)"
          git push
