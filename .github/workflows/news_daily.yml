name: A股全球热点新闻日报（云端）
# 触发方式：定时（北京时间每日07:00 = UTC 前一日23:00）+ 手动
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  news-daily:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 生成并推送新闻日报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python a_share_news_daily.py
