name: A股大盘每日战报推送

# 触发方式：定时 + 手动
on:
  schedule:
    # 北京时间 08:30 = UTC 00:30 (开盘前预期)
    - cron: '30 0 * * 1-5'
    # 北京时间 14:30 = UTC 06:30 (盘中战报)
    - cron: '30 6 * * 1-5'
    # 北京时间 15:30 = UTC 07:30 (收盘总结)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      period:
        description: '推送时段'
        required: true
        default: 'close'
        type: choice
        options:
          - morning
          - midday
          - close

jobs:
  # ============================================================
  # Job 1: 开盘前预期 (北京时间 08:30)
  # ============================================================
  morning-push:
    if: github.event_name == 'schedule' && github.event.schedule == '30 0 * * 1-5' || github.event_name == 'workflow_dispatch' && github.event.inputs.period == 'morning'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 发送开盘前预期战报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python a_share_daily_push.py --period morning

  # ============================================================
  # Job 2: 盘中战报 (北京时间 14:30)
  # ============================================================
  midday-push:
    if: github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1-5' || github.event_name == 'workflow_dispatch' && github.event.inputs.period == 'midday'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 发送盘中战报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python a_share_daily_push.py --period midday

  # ============================================================
  # Job 3: 收盘总结 (北京时间 15:30)
  # ============================================================
  close-push:
    if: github.event_name == 'schedule' && github.event.schedule == '30 7 * * 1-5' || github.event_name == 'workflow_dispatch' && github.event.inputs.period == 'close'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 发送收盘总结战报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python a_share_daily_push.py --period close
