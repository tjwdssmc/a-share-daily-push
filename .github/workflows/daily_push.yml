name: A股大盘每日战报云端推送
# 触发方式：定时 + 手动
on:
  schedule:
    # 北京时间 11:10 = UTC 03:10 (午盘前快报)
    - cron: '10 3 * * 1-5'
    # 北京时间 14:30 = UTC 06:30 (盘中战报)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      period:
        description: '推送时段'
        required: true
        default: 'midday'
        type: choice
        options:
          - midday
          - close

jobs:
  midday-1110:
    if: github.event_name == 'schedule' && github.event.schedule == '10 3 * * 1-5' || github.event_name == 'workflow_dispatch' && github.event.inputs.period == 'midday'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 发送午盘前快报战报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python a_share_daily_push.py --period midday

  midday-1430:
    if: github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1-5' || github.event_name == 'workflow_dispatch' && github.event.inputs.period == 'close'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 发送盘中战报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python a_share_daily_push.py --period midday